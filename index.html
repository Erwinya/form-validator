<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Form Validator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="top">
    <p class="kicker">Form Validator</p>
    <h1>Rule-based client validation</h1>
  </header>
  <main class="wrap">
    <form id="signup" class="panel" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" />
        <p class="error" data-error-for="name"></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" />
        <p class="error" data-error-for="email"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" />
        <p class="error" data-error-for="password"></p>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" />
        <p class="error" data-error-for="confirm"></p>
      </div>
      <button type="submit" class="btn">Create account</button>
      <p id="form-status" class="status" role="status"></p>
    </form>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
